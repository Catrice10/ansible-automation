---
- name: "Setting the borgmatic snippet path and name"
  ansible.builtin.set_fact:
    borgmatic_snippet_file: "{{ role_path }}/files/gdrive.yaml"
    borgmatic_snippet_name: gdrive

- name: Setup borgmatic Google Drive backup
  ansible.builtin.include_role:
    name: borgmatic_snippet
  vars:
    borgmatic_snippet_extract_paths:
      - /srv/rclone
